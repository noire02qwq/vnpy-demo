# 前端静态托管 + SPA fallback(expo-router 深链如 /result/<id> 需回退 index.html)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # 静态资源带内容哈希,可长缓存;html 入口不缓存(便于换版)
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
