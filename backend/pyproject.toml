[project]
name = "vn-demo-backend"
version = "0.1.0"
description = "vnpy 量化回测 demo 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "vnpy==4.5.0",
    "vnpy-ctastrategy==1.4.1",
    "yfinance>=0.2.54",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
